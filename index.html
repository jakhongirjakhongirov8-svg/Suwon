<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUWON</title>
<meta name="description" content="SUWON restorani: Koreys taomlari menyusi, onlayn buyurtma, yetkazib berish va stol band qilish.">
<meta name="theme-color" content="#11224A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311224A'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3ES%3C/text%3E%3Ccircle cx='48' cy='16' r='6' fill='%23D63341'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#11224A; --navy-2:#1B3366; --red:#D63341; --red-d:#B6222F; --sun:#F4B63F;
  --paper:#F4F5F8; --white:#fff; --line:#DDE1E8; --ink:#1A2233; --muted:#5C667A; --green:#1F7A4D;
  --r:12px;
  --display:'Black Han Sans','Arial Black',Impact,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;letter-spacing:.005em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:var(--r);
font-weight:800;text-decoration:none;transition:transform .15s,background .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:var(--red-d)}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-2)}
.btn-w{background:#fff;color:var(--navy)}.btn-w:hover{background:var(--paper)}
.btn-o{border:2px solid currentColor}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

header.top{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:var(--display);font-size:26px;color:var(--navy);letter-spacing:.04em}
.logo small{font-size:16px;color:var(--red)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:15px}
nav.main a:hover,nav.main a.on{background:var(--paper);color:var(--red)}
.cartbtn{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r);background:var(--red);color:#fff;font-weight:800}
.cartbtn svg{width:20px;height:20px}
.cartbtn .n{min-width:22px;height:22px;border-radius:11px;background:#fff;color:var(--red);font-size:13px;display:grid;place-items:center;padding:0 6px}
.burger{display:none;width:44px;height:44px;border-radius:var(--r);border:1px solid var(--line);place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:20px;height:2px;background:var(--ink);position:relative;transition:.2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded=true] span{background:transparent}
.burger[aria-expanded=true] span::before{top:0;transform:rotate(45deg)}
.burger[aria-expanded=true] span::after{top:0;transform:rotate(-45deg)}
@media(max-width:900px){
  .burger{display:grid;margin-left:auto}
  .cartbtn{order:3}
  nav.main{position:absolute;left:0;right:0;top:100%;background:var(--white);flex-direction:column;margin:0;padding:8px 16px 16px;
    border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(0,0,0,.08);display:none}
  nav.main.open{display:flex}
  nav.main a{padding:14px 12px;font-size:17px}
}
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hangul{position:absolute;right:-1%;bottom:-.2em;font-family:var(--display);font-size:clamp(220px,34vw,460px);line-height:1;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;user-select:none;white-space:nowrap}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;padding:68px 0 76px}
.hero h1{font-size:clamp(36px,5.6vw,64px)}
.hero .lead{margin:18px 0 28px;font-size:18px;max-width:32em;color:#CBD5EA}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.12);font-weight:700;font-size:14px;margin-bottom:18px}
.status i{width:10px;height:10px;border-radius:50%;background:#8A94A8}
.status.open i{background:#4ADE80}
.pick{background:var(--white);color:var(--ink);border-radius:18px;padding:22px;box-shadow:0 24px 50px rgba(0,0,0,.3)}
.pick h2{font-size:22px;color:var(--navy);margin-bottom:12px}
.pick ul{list-style:none}
.pick li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pick .em{width:52px;height:52px;border-radius:12px}
.pick b{display:block;line-height:1.25}
.pick small{color:var(--muted)}
.pick .plus{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;font-size:22px;display:grid;place-items:center}
.pick .plus:hover{background:var(--red-d)}
@media(max-width:900px){.hero-in{grid-template-columns:1fr;padding:44px 0 52px;gap:28px}}

section.s{padding:72px 0}
section.s.alt{background:var(--white)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.sh h2{font-size:clamp(28px,4vw,42px);color:var(--navy)}
.sh p{color:var(--muted);max-width:32em}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;height:46px;border-radius:var(--r);border:2px solid var(--line);background:var(--white);padding:0 14px 0 42px}
.search input:focus{border-color:var(--navy-2);outline:none}
.search svg{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--muted)}
.tog{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--white);font-weight:700;font-size:14px}
.tog[aria-pressed=true]{border-color:var(--green);background:#E8F5EE;color:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{height:42px;padding:0 18px;border-radius:21px;border:2px solid var(--line);background:var(--white);font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--white);border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 10px 28px rgba(17,34,74,.12);border-color:var(--navy-2)}
.card .em{width:100%;height:180px;cursor:pointer;display:block}
.card .bd{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;padding:14px 16px 16px}
.art{overflow:hidden;background:var(--paper);display:block}
.art svg,.art img,.art .fb{width:100%;height:100%;display:block}
.art img{object-fit:cover;object-position:center}
.art img.lo{object-fit:contain;background:#F4F5F8}
dialog .pic.art img.lo{width:auto;max-width:100%;height:220px;margin:0 auto}
#lb img.lo{width:auto;max-width:100%;max-height:min(90vh,352px);margin:0 auto;background:#F4F5F8}
.card .em:has(img.lo){height:150px;display:flex;align-items:center;justify-content:center}
.card .em img.lo{width:150px;height:150px;margin:0}
.card h3{font-size:18px;cursor:pointer}

.card .ds{color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;min-height:20px}
.wt{color:var(--muted);font-weight:700}
.badge{padding:1px 8px;border-radius:10px;background:#E8F5EE;color:var(--green);font-weight:700;font-size:12px}
.badge.hit{background:#FFF1D1;color:#8A5A00}
.card .foot{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:8px}
.card .pr{font-weight:800;font-size:18px;color:var(--navy);white-space:nowrap}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;color:var(--muted);background:var(--white);border:2px dashed var(--line);border-radius:16px}

.about{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.about div{padding:24px;border-radius:16px;background:var(--paper);border:1px solid var(--line)}
.about .ic{font-size:34px;margin-bottom:8px}
.about h3{font-size:20px;color:var(--navy);margin-bottom:6px}
.about p{color:var(--muted);font-size:15px}
@media(max-width:760px){.about{grid-template-columns:1fr}}

.resv{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:start}
.resv .txt h2{font-size:clamp(28px,4vw,42px);color:var(--navy);margin-bottom:12px}
.resv .txt p{color:var(--muted);margin-bottom:10px}
.resv .txt ul{list-style:none;display:grid;gap:8px;margin-top:14px}
.resv .txt li{font-weight:700}
.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:900px){.resv{grid-template-columns:1fr}}
@media(max-width:480px){.f2{grid-template-columns:1fr}}
.fld{display:grid;gap:5px;margin-bottom:14px}
.fld label{font-weight:800;font-size:14px}
.fld input,.fld textarea,.fld select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--white)}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--navy-2);outline:none}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--red)}
.fld .err{display:none;color:var(--red);font-size:13px}
.fld.bad .err{display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt span{display:block;text-align:center;padding:12px 8px;border:2px solid var(--line);border-radius:var(--r);font-weight:700;font-size:14px}
.opt input:checked+span{border-color:var(--red);background:#FDECEE;color:var(--red-d)}
.opt input:focus-visible+span{outline:3px solid var(--sun)}
.ok{text-align:center;padding:26px 6px}
.ok .tick{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.ok .tick svg{width:38px;height:38px}
.ok h3{font-size:24px;margin-bottom:8px;color:var(--navy)}
.ok .code{display:inline-block;margin:8px 0 14px;padding:8px 16px;background:var(--sun);border-radius:8px;font-weight:800;font-size:20px;letter-spacing:.04em}
.ok p{color:var(--muted);margin-bottom:10px}
.ok .btn{width:100%;margin-top:8px}

.faq{max-width:820px}
details{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
summary{padding:16px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--red)}
details[open] summary::after{content:"–"}
details p{padding:0 18px 16px;color:var(--muted)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.contact .box{background:var(--navy);color:#fff;border-radius:18px;padding:28px}
.contact .box h3{font-size:26px;margin-bottom:10px}
.contact ul{list-style:none;display:grid;gap:10px;margin:14px 0 20px}
.contact li a{text-decoration:none;font-weight:800}
.contact .info{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px}
.contact .info h3{color:var(--navy);font-size:24px}
.contact .info dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin-top:12px}
.contact .info dt{color:var(--muted)}
@media(max-width:760px){.contact{grid-template-columns:1fr}}
footer{background:var(--ink);color:#B4BDCD;padding:26px 0 calc(26px + env(safe-area-inset-bottom,0));font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.ov{position:fixed;inset:0;background:rgba(10,18,36,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--white);z-index:90;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:24px;color:var(--navy)}
.x{width:42px;height:42px;border-radius:10px;font-size:26px;line-height:1;display:grid;place-items:center}
.x:hover{background:var(--paper)}
.drawer .body{flex:1;overflow:auto;padding:14px 18px}
.drawer .foot{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--paper)}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--paper)}
.line .th{width:56px;height:56px;border-radius:12px}
.line b{display:block;font-size:15px;line-height:1.25}
.line small{color:var(--muted)}
.line .rt{text-align:right}
.qty{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
.qty button{width:34px;height:34px;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:800}
.rm{color:var(--red);font-size:13px;font-weight:700}
.sum{display:grid;gap:4px;margin-bottom:12px;font-size:15px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:800;font-size:19px;padding-top:6px;border-top:1px solid var(--line)}
.sum .free{color:var(--green);font-weight:700}
.warn{display:none;background:#FFF1D1;color:#6B4600;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px}
.warn.on{display:block}

dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;margin:auto;box-shadow:0 30px 70px rgba(0,0,0,.35);position:fixed;inset:0;height:fit-content}
dialog::backdrop{background:rgba(10,18,36,.6)}
dialog .pic{height:auto;max-height:55vh;background:#F4F5F8;cursor:zoom-in;position:relative}
dialog .pic.art img{height:auto;max-height:55vh;object-fit:contain}
dialog .pic.art svg{height:200px}
dialog .pic[data-zoom]::after{content:attr(data-zoom);position:absolute;left:10px;bottom:10px;background:rgba(17,34,74,.8);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;pointer-events:none}
#lb{background:transparent;box-shadow:none;width:min(920px,calc(100% - 16px));overflow:visible;cursor:zoom-out}
#lb::backdrop{background:rgba(10,18,36,.88)}
#lb img{width:100%;height:auto;max-height:90vh;object-fit:contain;border-radius:14px}
dialog .in{padding:22px}
dialog h3{font-size:28px;color:var(--navy);margin-bottom:6px}
dialog .close{position:absolute;right:10px;top:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);border-radius:50%}
dialog .tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
dialog .ing{color:var(--muted);font-size:15px;margin-bottom:16px}
dialog .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}


.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;
z-index:120;opacity:0;pointer-events:none;transition:.25s;font-weight:700;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.logo{white-space:nowrap}
@media(max-width:480px){.logo{font-size:22px}.logo small{font-size:13px}.bar{gap:10px}.cartbtn{padding:0 10px}}

.lang{display:flex;border:2px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.lang button{height:40px;padding:0 11px;font-weight:800;font-size:13px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
@media(max-width:900px){.lang{margin-left:auto;order:1}.burger{margin-left:0;order:2}}
@media(max-width:430px){.cartbtn .cl{display:none}.cartbtn{padding:0 12px}.lang button{padding:0 9px}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#top" data-i18n-aria="logo_aria" aria-label="SUWON">SUWON<small>수원</small></a>
    <nav class="main" id="nav" data-i18n-aria="nav_aria" aria-label="Menu">
      <a href="#menyu" data-i18n="nav_menu"></a>
      <a href="#haqida" data-i18n="nav_about"></a>
      <a href="#stol" data-i18n="nav_resv"></a>
      <a href="#savol" data-i18n="nav_faq"></a>
      <a href="#aloqa" data-i18n="nav_contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Til / Язык">
      <button type="button" data-lang="uz" aria-pressed="true">UZ</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
    <button class="cartbtn" id="cartBtn" data-i18n-aria="cart_open" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h3l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.5L21 8H7"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="17" cy="20.5" r="1.4"/></svg>
      <span class="cl" data-i18n="cart"></span> <span class="n" id="cartN">0</span>
    </button>
    <button class="burger" id="burger" data-i18n-aria="burger" aria-label="Menu" aria-expanded="false" aria-controls="nav"><span></span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hangul" aria-hidden="true">수원</div>
    <div class="wrap hero-in">
      <div>
        <div class="status" id="status"><i></i><span id="statusTx"></span></div>
        <h1 data-i18n="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="acts">
          <a class="btn btn-r" href="#menyu" data-i18n="btn_menu"></a>
          <a class="btn btn-w" href="#stol" data-i18n="btn_resv"></a>
        </div>
      </div>
      <div class="pick" role="group" data-i18n-aria="pick_aria" aria-label="Pick">
        <h2 data-i18n="pick_h"></h2>
        <ul id="pickList"></ul>
      </div>
    </div>
  </section>

  <section class="s" id="menyu">
    <div class="wrap">
      <div class="sh">
        <h2 data-i18n="menu_h"></h2>
        <p data-i18n="menu_p"></p>
      </div>
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <label class="sr" for="q" data-i18n="search_label"></label>
          <input id="q" type="search" data-i18n-ph="search_ph" autocomplete="off">

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {

  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let lang = store.get("suwon_lang", null);
if(lang !== "uz" && lang !== "ru") lang = (navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "uz";
function t(k, ...a){ const v = (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : T.uz[k]; return typeof v === "function" ? v(...a) : v; }
const nm = p => p.name[lang], ds = p => p.desc[lang], ig = p => p.ing[lang];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const money = n => fmt(n) + " " + t("cur");
const byId = id => MENU.find(p => p.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pepp = n => n ? "🌶️".repeat(n) : "";
const telDigits = CONFIG.phone.replace(/[^\d+]/g, "");
function norm(s){ return String(s).toLowerCase().replace(/[ʻʼ`’‘']/g, "").replace(/\s+/g, " ").trim(); }
MENU.forEach(p => { p.hay = norm([p.name.uz, p.name.ru, p.desc.uz, p.desc.ru, p.keys.join(" "), T.uz["cat_" + p.cat], T.ru["cat_" + p.cat]].join(" ")); });

function placeholder(p){

}
function pic(p){
  const src = IMG[p.id];
  return src ? `<img${p.id>=10?' class="lo"':''} src="${src}" alt="${esc(nm(p))}" loading="lazy" decoding="async">` : placeholder(p);
}

function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200);
}
function addToCart(id, qty = 1, silent){
  const it = cart.find(i => i.id === id);
  if(it) it.qty = Math.min(99, it.qty + qty); else cart.push({id, qty});

  if(!silent) toast(t("added") + " " + nm(byId(id)));
  if($("#drawer").classList.contains("on")) renderDrawer();
}

/* ===== Telegram (restoranga xabarlar doim o'zbekcha) ===== */
function telegramURL(text){
  const q = encodeURIComponent(text);
  if(CONFIG.telegram) return `https://t.me/${CONFIG.telegram.replace("@","")}?text=${q}`;
  if(CONFIG.tgAdminId) return `tg://msg?to=${CONFIG.tgAdminId}&text=${q}`;
  return `https://t.me/share/url?url=%20&text=${q}`;
}
function copyText(s){
  try{
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(s).catch(() => {}); return; }
    const ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }catch(e){}
}
function openTelegram(text){
  const a = document.createElement("a"); a.href = telegramURL(text); a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
const tgHref = CONFIG.telegram ? "https://t.me/" + CONFIG.telegram.replace("@","") : "";
const outbox = {get:() => store.get("suwon_outbox", []), set:v => store.set("suwon_outbox", v)};
const tgReady = () => !!(CONFIG.tgEndpoint || (CONFIG.tgBotToken && CONFIG.tgChatId));
async function tgPost(text){
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 10000);
  try{
    const url = CONFIG.tgEndpoint || `https://api.telegram.org/bot${CONFIG.tgBotToken}/sendMessage`;
    const body = CONFIG.tgEndpoint ? {text} : {chat_id: CONFIG.tgChatId, text};
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body), signal: ctrl.signal});
    return r.ok;
  }catch(e){ return false; } finally{ clearTimeout(to); }
}
let flushing = false;
async function flushOutbox(){
  if(flushing || !tgReady()) return outbox.get().length === 0;
  flushing = true;
  try{
    const q = outbox.get();
    while(q.length){ if(!(await tgPost(q[0].text))) break; q.shift(); outbox.set(q); }
    return q.length === 0;
  } finally { flushing = false; }
}
async function sendTG(text){
  if(!tgReady()) return false;
  const q = outbox.get(); q.push({text, t: Date.now()}); outbox.set(q.slice(-100));
  return await flushOutbox();
}
window.addEventListener("online", flushOutbox); setInterval(flushOutbox, 60000); flushOutbox();

$("#vegBtn").addEventListener("click", e => { st.veg = !st.veg; e.currentTarget.setAttribute("aria-pressed", st.veg); renderGrid(); });

function renderGrid(){
  const list = MENU.filter(p => (st.cat === "all" || p.cat === st.cat) && (!st.veg || p.veg) && (!st.q || p.hay.includes(st.q)));
  $("#grid").innerHTML = list.length ? list.map(p => `
    <article class="card">
      <div class="em art" data-more="${p.id}" role="button" tabindex="0" aria-label="${esc(t("about_dish", nm(p)))}">${pic(p)}</div>
      <div class="bd">
        <h3 data-more="${p.id}">${esc(nm(p))}</h3>
        <p class="ds">${esc(ds(p))}</p>
        <div class="meta">${p.w ? `<span class="wt">${p.w} ${esc(t("g"))}</span>` : ""}${p.spice ? `<span title="${esc(t("spicy"))}">${pepp(p.spice)}</span>` : ""}${p.veg ? `<span class="badge">${esc(t("b_veg"))}</span>` : ""}${p.hit ? `<span class="badge hit">${esc(t("b_hit"))}</span>` : ""}</div>
        <div class="foot"><span class="pr">${money(p.price)}</span><button class="btn btn-r btn-sm" data-add="${p.id}">${esc(t("add"))}</button></div>
      </div>
    </article>`).join("") : `<div class="empty">${esc(t("none_found"))}</div>`;
}
$("#grid").addEventListener("click", e => {
  const a = e.target.closest("[data-add]"), m = e.target.closest("[data-more]");
  if(a) addToCart(+a.dataset.add); else if(m) openDish(+m.dataset.more);
});
$("#grid").addEventListener("keydown", e => { if((e.key === "Enter" || e.key === " ") && e.target.dataset.more){ e.preventDefault(); openDish(+e.target.dataset.more); }});

/* ===== Taom oynasi ===== */
const dlg = $("#dlg"), lb = $("#lb");
lb.addEventListener("click", () => lb.close());
let dq = 1, dcur = null;
function openDish(id){
  dcur = byId(id); dq = 1; drawDish();
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}
function drawDish(){
  const p = dcur;
  dlg.innerHTML = `
    <div class="pic art"${IMG[p.id] ? ` data-zoom="${esc(t("zoom"))}"` : ""}>${pic(p)}</div>
    <button class="x close" aria-label="${esc(t("close"))}" data-close>×</button>
    <div class="in">
      <h3 id="dTitle">${esc(nm(p))}</h3>
      <p>${esc(ds(p))}</p>
      <div class="tags">${p.w ? `<span class="wt">${p.w} ${esc(t("g"))}</span>` : ""}${p.spice ? `<span>${esc(t("spice_l"))} ${pepp(p.spice)}</span>` : `<span>${esc(t("not_spicy"))}</span>`}${p.veg ? `<span class="badge">${esc(t("b_veg"))}</span>` : ""}${p.hit ? `<span class="badge hit">${esc(t("b_hit"))}</span>` : ""}</div>
      <p class="ing"><b>${esc(t("ing_l"))}</b> ${esc(ig(p))}</p>
      <div class="row">
        <div class="qty" style="margin:0"><button data-d="-1" aria-label="${esc(t("dec"))}">−</button><span>${dq}</span><button data-d="1" aria-label="${esc(t("inc"))}">+</button></div>
        <button class="btn btn-r" data-buy>${esc(t("to_cart"))} ${money(p.price * dq)}</button>
      </div>
    </div>`;
}
dlg.addEventListener("click", e => {
  if(e.target === dlg || e.target.closest("[data-close]")) return dlg.close();
  const pc = e.target.closest(".pic");
  if(pc){ const im = pc.querySelector("img"); if(im){ lb.innerHTML = `<img class="${im.className}" src="${im.src}" alt="${esc(im.alt)}">`; lb.showModal(); } return; }
  const d = e.target.closest("[data-d]");
  if(d){ dq = Math.max(1, Math.min(20, dq + +d.dataset.d)); drawDish(); return; }
  if(e.target.closest("[data-buy]")){ addToCart(dcur.id, dq); dlg.close(); }
});

/* ===== Savat paneli ===== */
const drawer = $("#drawer"), ov = $("#ov");
let view = "cart", lastOrder = null, curDlv = "Yetkazib berish";
function openDrawer(v){
  view = v || "cart"; renderDrawer();
  drawer.classList.add("on"); ov.classList.add("on"); drawer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}
function closeDrawer(){
  drawer.classList.remove("on"); ov.classList.remove("on"); drawer.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}
$("#cartBtn").addEventListener("click", () => openDrawer("cart"));
$("#dwClose").addEventListener("click", closeDrawer);
ov.addEventListener("click", closeDrawer);

function sumHTML(){
  const sub = subtotal(), fee = feeFor(view === "form" ? curDlv : "Yetkazib berish", sub);
  const showFee = view === "form";
  return `<div class="sum">
    <div><span>${esc(t("s_food"))}</span><span>${money(sub)}</span></div>
    ${showFee ? `<div><span>${esc(t("s_dlv"))}</span><span class="${fee ? "" : "free"}">${curDlv === "Yetkazib berish" ? (fee ? money(fee) : esc(t("free"))) : esc(t("pickup_note"))}</span></div>` : ""}
    <div class="t"><span>${esc(t("total"))}</span><span>${money(sub + (showFee ? fee : 0))}</span></div></div>`;
}
function renderDrawer(){
  const body = $("#dwBody"), foot = $("#dwFoot"), title = $("#dwTitle");
  if(view === "cart"){
    title.textContent = t("d_cart");
    if(!cart.length){
      body.innerHTML = `<div class="ok"><p>${esc(t("empty_cart"))}</p></div>`;
      foot.innerHTML = `<button class="btn btn-r" style="width:100%" id="goMenu">${esc(t("go_menu"))}</button>`;
      $("#goMenu").onclick = () => { closeDrawer(); location.hash = "#menyu"; }; return;
    }
    body.innerHTML = cart.map(i => { const p = byId(i.id); return `
      <div class="line"><div class="th art">${pic(p)}</div>
        <div><b>${esc(nm(p))}</b><small>${money(p.price)}</small>
          <div class="qty"><button data-dec="${p.id}" aria-label="${esc(t("dec"))}">−</button><span>${i.qty}</span><button data-inc="${p.id}" aria-label="${esc(t("inc"))}">+</button></div></div>
        <div class="rt"><b>${money(p.price * i.qty)}</b><button class="rm" data-rm="${p.id}">${esc(t("remove"))}</button></div></div>`; }).join("");
    foot.innerHTML = sumHTML() + `<button class="btn btn-r" style="width:100%" id="toForm">${esc(t("checkout"))}</button>`;
    $("#toForm").onclick = () => { view = "form"; renderDrawer(); };
  }
  else if(view === "form"){
    title.textContent = t("d_order");
    const d = store.get("suwon_user", {});
    body.innerHTML = `
      <form id="oForm" novalidate>
        <div class="fld"><label>${esc(t("how"))}</label>
          <div class="opts">
            <label class="opt"><input type="radio" name="dlv" value="Yetkazib berish" ${curDlv==="Yetkazib berish"?"checked":""}><span>${esc(t("dlv_opt"))}</span></label>
            <label class="opt"><input type="radio" name="dlv" value="Olib ketaman" ${curDlv==="Olib ketaman"?"checked":""}><span>${esc(t("pick_opt"))}</span></label>
          </div></div>
        <div class="fld" id="f-name"><label for="oName">${esc(t("name_l"))}</label><input id="oName" autocomplete="name" value="${esc(d.name||"")}" placeholder="${esc(t("name_ph"))}"><span class="err">${esc(t("name_err"))}</span></div>
        <div class="fld" id="f-phone"><label for="oPhone">${esc(t("phone_l"))}</label><input id="oPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(d.phone||"")}" placeholder="+998 90 123 45 67"><span class="err">${esc(t("phone_err"))}</span></div>
        <div class="fld" id="f-addr"><label for="oAddr">${esc(t("addr_label"))}</label><textarea id="oAddr" autocomplete="street-address" placeholder="${esc(t("addr_ph"))}">${esc(d.addr||"")}</textarea><span class="err">${esc(t("addr_err"))}</span></div>
        <div class="fld"><label for="oWhen">${esc(t("when_l"))}</label>
          <select id="oWhen">${T.uz.when.map((v,i) => `<option value="${esc(v)}">${esc(t("when")[i])}</option>`).join("")}</select></div>
        <div class="fld"><label>${esc(t("pay_l"))}</label>
          <div class="opts">
            <label class="opt"><input type="radio" name="pay" value="Naqd" checked><span>${esc(t("cash"))}</span></label>
            <label class="opt"><input type="radio" name="pay" value="Karta"><span>${esc(t("card"))}</span></label>
          </div></div>
        <div class="fld"><label for="oNote">${esc(t("note_l"))}</label><textarea id="oNote" placeholder="${esc(t("note_ph_o"))}"></textarea></div>
      </form>`;
    foot.innerHTML = `<div class="warn" id="warn"></div><div id="sumBox">${sumHTML()}</div>
      <button class="btn btn-r" style="width:100%" id="send">${esc(t("confirm"))}</button>
      <button class="btn btn-sm" style="width:100%;margin-top:8px;color:var(--navy)" id="back">${esc(t("back_cart"))}</button>`;
    $("#oPhone").addEventListener("input", e => { e.target.value = fmtPhone(e.target.value); });
    const sync = () => {
      curDlv = $('input[name=dlv]:checked').value;
      $("#f-addr").style.display = curDlv === "Yetkazib berish" ? "" : "none";
      $("#sumBox").innerHTML = sumHTML();
      const low = curDlv === "Yetkazib berish" && subtotal() < CONFIG.minDelivery;
      $("#warn").classList.toggle("on", low);
      $("#warn").textContent = low ? t("min_warn", money(CONFIG.minDelivery), money(CONFIG.minDelivery - subtotal())) : "";
      $("#send").disabled = low;
    };
    $$('input[name=dlv]').forEach(r => r.addEventListener("change", sync)); sync();
    $("#back").onclick = () => { view = "cart"; renderDrawer(); };
    $("#send").onclick = submitOrder;
  }
  else if(view === "done"){
    title.textContent = t("d_done");
    const o = lastOrder;
    body.innerHTML = `<div class="ok">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3>${esc(t("thanks", o.name.split(" ")[0]))}</h3>
      <div class="code">${esc(o.id)}</div>
      <p>${esc(o.sent ? t("sent_ok") : t("sent_no"))} ${t("op_call", esc(o.phone))}</p>
      ${o.sent ? "" : `<a class="btn btn-n" href="${telegramURL(orderText(o))}" target="_blank" rel="noopener">${esc(t("via_tg"))}</a>`}
      <a class="btn btn-o" style="color:var(--navy)" href="tel:${telDigits}">${esc(t("call"))}</a></div>`;
    foot.innerHTML = `<button class="btn btn-r" style="width:100%" id="fin">${esc(t("close"))}</button>`;
    const tb = body.querySelector("a.btn-n");
    if(tb) tb.addEventListener("click", () => copyText("🆕 " + orderText(o)));
    $("#fin").onclick = closeDrawer;
  }
}
$("#dwBody").addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), rm = e.target.closest("[data-rm]");
  if(inc) addToCart(+inc.dataset.inc, 1, true);
  if(dec){ const it = cart.find(i => i.id === +dec.dataset.dec); it.qty--; if(it.qty < 1) cart = cart.filter(i => i !== it); saveCart(); renderDrawer(); }
  if(rm){ cart = cart.filter(i => i.id !== +rm.dataset.rm); saveCart(); renderDrawer(); }
});

function fmtPhone(v){
  let d = v.replace(/\D/g, ""); if(d.startsWith("998")) d = d.slice(3); d = d.slice(0, 9);
  let r = "+998"; if(d.length) r += " " + d.slice(0,2); if(d.length > 2) r += " " + d.slice(2,5);
  if(d.length > 5) r += " " + d.slice(5,7); if(d.length > 7) r += " " + d.slice(7,9); return r;
}
const phoneOk = v => v.replace(/\D/g,"").length === 12;
const setBad = (id, bad) => { $(id).classList.toggle("bad", bad); return bad; };
const code = p => p + "-" + Math.floor(100000 + Math.random() * 900000);

async function submitOrder(){
  const name = $("#oName").value.trim(), phone = $("#oPhone").value.trim(), addr = $("#oAddr").value.trim();
  const dlv = $('input[name=dlv]:checked').value, pay = $('input[name=pay]:checked').value, note = $("#oNote").value.trim(), when = $("#oWhen").value;
  const needAddr = dlv === "Yetkazib berish";
  const bad = [setBad("#f-name", name.length < 2), setBad("#f-phone", !phoneOk(phone)), setBad("#f-addr", needAddr && addr.length < 5)];
  if(bad.some(Boolean)){ const f = $(".fld.bad input, .fld.bad textarea"); if(f) f.focus(); return; }
  const sub = subtotal(), fee = feeFor(dlv, sub);
  const order = {id: code("SW"), date: new Date().toISOString(), name, phone, dlv, addr: needAddr ? addr : "", when, pay, note,
    items: cart.map(i => ({name:byId(i.id).name.uz, qty:i.qty, price:byId(i.id).price})), sub, fee, total: sub + fee, status: "Qabul qilindi"};
  const sb = $("#send"); sb.disabled = true; sb.textContent = t("sending");
  const txt = "🆕 " + orderText(order);
  if(!tgReady()){ copyText(txt); openTelegram(txt); }   // нет бота: копируем заказ и открываем чат с админом
  order.sent = await sendTG(txt);
  const all = store.get("suwon_orders", []); all.unshift(order); store.set("suwon_orders", all.slice(0, 50));
  store.set("suwon_user", {name, phone, addr});
  lastOrder = order; cart = []; saveCart(); view = "done"; renderDrawer();
}
const moneyUz = n => fmt(n) + " so'm";
function orderText(o){
  const L = ["SUWON buyurtma " + o.id, "Ism: " + o.name, "Telefon: " + o.phone, "Olish: " + o.dlv + (o.addr ? " — " + o.addr : ""), "Vaqt: " + o.when, "To'lov: " + o.pay, "",
    ...o.items.map(i => `• ${i.name} × ${i.qty} = ${moneyUz(i.price * i.qty)}`), "",
    o.fee ? "Yetkazish: " + moneyUz(o.fee) : "", "Jami: " + moneyUz(o.total)];
  if(o.note) L.push("Izoh: " + o.note);
  return L.filter(x => x !== "").join("\n");
}

/* ===== Stol band qilish ===== */
function slots(dateStr){
  const out = [], s = toMin(CONFIG.openAt), e = toMin(CONFIG.closeAt) - 60;
  const today = localToday() === dateStr, nowM = new Date().getHours()*60 + new Date().getMinutes() + 30;
  for(let m = s; m <= e; m += 30){ if(today && m < nowM) continue; out.push(String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0")); }
  return out;
}
function localToday(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function renderResv(){
  const d = store.get("suwon_user", {}), td = localToday();
  $("#resvPanel").innerHTML = `
    <form id="rForm" novalidate>
      <div class="f2">
        <div class="fld" id="r-name"><label for="rName">${esc(t("name_l"))}</label><input id="rName" autocomplete="name" value="${esc(d.name||"")}" placeholder="${esc(t("name_ph"))}"><span class="err">${esc(t("name_err"))}</span></div>
        <div class="fld" id="r-phone"><label for="rPhone">${esc(t("phone_l"))}</label><input id="rPhone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(d.phone||"")}" placeholder="+998 90 123 45 67"><span class="err">${esc(t("phone_err"))}</span></div>
        <div class="fld" id="r-date"><label for="rDate">${esc(t("r_date"))}</label><input id="rDate" type="date" min="${td}" value="${td}"><span class="err">${esc(t("r_date_err"))}</span></div>
        <div class="fld" id="r-time"><label for="rTime">${esc(t("r_time"))}</label><select id="rTime"></select><span class="err">${esc(t("r_time_err"))}</span></div>
      </div>
      <div class="fld"><label for="rGuests">${esc(t("r_guests"))}</label><select id="rGuests">${Array.from({length:CONFIG.maxGuests},(_,i)=>`<option value="${i+1}" ${i===1?"selected":""}>${esc(t("r_n", i+1))}</option>`).join("")}</select></div>
      <div class="fld"><label for="rNote">${esc(t("r_note"))}</label><textarea id="rNote" placeholder="${esc(t("r_note_ph"))}"></textarea></div>
      <button class="btn btn-r" style="width:100%" type="submit">${esc(t("r_btn"))}</button>
    </form>`;
  const fillTimes = () => {
    const s = slots($("#rDate").value);
    $("#rTime").innerHTML = s.length ? s.map(x => `<option>${x}</option>`).join("") : `<option value="">${esc(t("r_none"))}</option>`;
  };
  fillTimes();
  $("#rDate").addEventListener("change", fillTimes);
  $("#rPhone").addEventListener("input", e => { e.target.value = fmtPhone(e.target.value); });
  $("#rForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#rName").value.trim(), phone = $("#rPhone").value.trim(), date = $("#rDate").value, time = $("#rTime").value;
    const bad = [setBad("#r-name", name.length < 2), setBad("#r-phone", !phoneOk(phone)), setBad("#r-date", !date || date < localToday()), setBad("#r-time", !time)];
    if(bad.some(Boolean)){ const f = $("#rForm .fld.bad input, #rForm .fld.bad select"); if(f) f.focus(); return; }
    const b = {id: code("BR"), name, phone, date, time, guests: +$("#rGuests").value, note: $("#rNote").value.trim(), status: "Qabul qilindi"};
    const all = store.get("suwon_bookings", []); all.unshift(b); store.set("suwon_bookings", all.slice(0, 30));
    const u = store.get("suwon_user", {}); store.set("suwon_user", {...u, name, phone});
    const txt = ["📅 SUWON stol band qilish " + b.id, "Ism: " + name, "Telefon: " + phone, "Sana: " + date + ", " + time, "Mehmonlar: " + b.guests, b.note ? "Izoh: " + b.note : ""].filter(Boolean).join("\n");
    const sbtn = $("#rForm button[type=submit]"); sbtn.disabled = true; sbtn.textContent = t("sending");
    const sent = await sendTG(txt);
    $("#resvPanel").innerHTML = `<div class="ok">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h3>${esc(t("r_done"))}</h3><div class="code">${esc(b.id)}</div>
      <p>${esc(date)}, ${esc(time)}, ${esc(t("r_n", b.guests))}. ${esc(sent ? t("r_sent_ok") : t("r_sent_no"))} ${t("op_call", esc(phone))}</p>
      ${sent ? "" : `<a class="btn btn-n" href="${telegramURL(txt)}" target="_blank" rel="noopener">${esc(t("via_tg"))}</a>`}
      <a class="btn btn-o" style="color:var(--navy)" href="tel:${telDigits}">${esc(t("call"))}</a>
      <button class="btn btn-sm" style="color:var(--navy)" id="again">${esc(t("r_again"))}</button></div>`;
    $("#again").onclick = renderResv;
  });
}

/* ===== Tilni almashtirish ===== */
function snap(sel){
  const r = $(sel); if(!r) return null; const o = {};
  r.querySelectorAll("input,textarea,select").forEach(el => {
    if(el.type === "radio"){ if(el.checked) o["r:" + el.name] = el.value; }
    else if(el.id) o[el.id] = el.value;
  });
  return o;
}
function unsnap(sel, o){
  const r = $(sel); if(!r || !o) return;
  r.querySelectorAll("input,textarea,select").forEach(el => {
    if(el.type === "radio"){ if(el.name !== "dlv" && ("r:" + el.name) in o) el.checked = o["r:" + el.name] === el.value; }
    else if(el.id && el.id in o) el.value = o[el.id];
  });
}
function setLang(l){
  const sd = drawer.classList.contains("on") && view === "form" ? snap("#dwBody") : null;
  const sr = $("#rForm") ? snap("#resvPanel") : null;
  lang = l; store.set("suwon_lang", l);
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  applyStatic(); fillContact(); updateStatus(); renderChips(); renderPick(); renderGrid();
  if($("#rForm")){ renderResv(); unsnap("#resvPanel", sr); }
  if(drawer.classList.contains("on")){ renderDrawer(); unsnap("#dwBody", sd); }
  if(dlg.open && dcur) drawDish();
}
$$(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(drawer.classList.contains("on") && !dlg.open && !lb.open) closeDrawer();
  else if(nav.classList.contains("open")){ nav.classList.remove("open"); burger.setAttribute("aria-expanded", false); }
});
setInterval(updateStatus, 60000);

renderResv();
saveCart();
setLang(lang);

</script>
